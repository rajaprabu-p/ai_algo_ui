<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>User Login</title>
    <style>
      :root {
        --bg-a: #f6fbff;
        --bg-b: #eef7f3;
        --card-bg: rgba(255, 255, 255, 0.95);
        --card-border: #d6e5de;
        --title: #0f3f71;
        --text: #0f172a;
        --muted: #475569;
        --input-bg: #f9fffc;
        --input-border: #bfd3ca;
        --focus: #1d4ed8;
        --btn: #0f766e;
        --btn-hover: #0b5f58;
        --error: #b91c1c;
      }

      * { box-sizing: border-box; }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 20%, rgba(29, 78, 216, 0.16), transparent 32%),
          radial-gradient(circle at 85% 25%, rgba(15, 118, 110, 0.17), transparent 35%),
          linear-gradient(180deg, var(--bg-a), var(--bg-b));
        padding: 1rem;
      }

      .card {
        width: 100%;
        max-width: 430px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 1.35rem;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(2px);
      }

      .brand {
        font-size: 0.82rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 0.25rem;
      }

      h1 {
        margin: 0 0 0.2rem;
        color: var(--title);
      }

      .subtitle {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 0.94rem;
      }

      label {
        display: block;
        margin-top: 0.8rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 0.62rem 0.65rem;
        margin-top: 0.35rem;
        border-radius: 8px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--text);
      }

      input:focus {
        outline: none;
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
      }

      button {
        width: 100%;
        margin-top: 1rem;
        padding: 0.68rem 1rem;
        border: 0;
        border-radius: 9px;
        background: linear-gradient(90deg, var(--btn) 0%, #1d4ed8 100%);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(15, 118, 110, 0.25);
        filter: saturate(1.05);
      }

      .error {
        color: var(--error);
        margin-top: 0.8rem;
        font-weight: 600;
      }

      .notice {
        margin-top: 0.8rem;
        padding: 0.6rem 0.75rem;
        border-radius: 8px;
        background: #fef3c7;
        color: #78350f;
        font-size: 0.9rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">RP Algo</div>
      <h1>Login</h1>
      <p class="subtitle">Sign in to access strategy controls and logs.</p>
      <form method="post" action="/login">
        <label>
          Username
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign In</button>
      </form>
      {% if notice %}
      <div class="notice">{{ notice }}</div>
      {% endif %}
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </div>
  </body>
</html>
